name: Build Native Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cocos2d-x engine libs are now committed directly in the repo
      - name: Verify engine libs present
        run: ls client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs/*.a 2>/dev/null | head -3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK r21e
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;21.4.7075529" "platforms;android-33" "build-tools;33.0.3"
          echo "NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties

      - name: Decode official keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/scmj-release.jks

      - name: Build signed release APK (官方固定签名,可覆盖安装)
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :SCMJ:assembleRelease \
            -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/scmj-release.jks \
            -PRELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-android-release-signed
          path: client/build/jsb-default/frameworks/runtime-src/proj.android-studio/**/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify engine libs present
        run: ls client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs/*.a

      - name: Re-archive libwebp (旧归档成员未 8 字节对齐,新 ld 拒绝)
        run: |
          LIBS="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs"
          lipo "$LIBS/libwebp.a" -thin arm64 -output /tmp/webp_arm64.a || cp "$LIBS/libwebp.a" /tmp/webp_arm64.a
          rm -rf /tmp/wp && mkdir -p /tmp/wp && cd /tmp/wp
          ar x /tmp/webp_arm64.a
          libtool -static -o /tmp/webp_fixed.a *.o
          cp /tmp/webp_fixed.a "$LIBS/libwebp.a"
          lipo -info "$LIBS/libwebp.a"

      - name: Build OpenAL Soft (苹果已从 iOS 移除系统 OpenAL,编译静态库直接打进包)
        run: |
          OAL="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/openal-soft"
          cmake -S "$OAL" -B "$OAL/build-ios" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLIBTYPE=STATIC \
            -DALSOFT_REQUIRE_COREAUDIO=ON \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL=OFF
          cmake --build "$OAL/build-ios" --parallel
          ls -la "$OAL/build-ios/libopenal.a"

      - name: List Xcode projects and targets
        run: |
          echo "=== cocos2d_libs targets ==="
          xcodebuild -project client/build/jsb-default/frameworks/cocos2d-x/build/cocos2d_libs.xcodeproj -list 2>&1 | head -20
          echo "=== SCMJ targets ==="
          xcodebuild -project client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/SCMJ.xcodeproj -list 2>&1 | head -20

      - name: Build cocos2d engine (libcocos2d iOS.a)
        run: |
          set -e
          XPROJ="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/build/cocos2d_libs.xcodeproj"
          OUT_DIR="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/build/build/Release-iphoneos"
          echo "Building cocos2d_libs..."
          xcodebuild -project "$XPROJ" \
            -target "libcocos2d iOS" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -20
          echo "--- Looking for libcocos2d iOS.a ---"
          find "$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x" -name "libcocos2d iOS.a" 2>/dev/null
          echo "--- Copying to ios/libs ---"
          SRC=$(find "$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x" -name "libcocos2d iOS.a" 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then echo "ERROR: libcocos2d iOS.a not found!"; exit 1; fi
          DST="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs/libcocos2d iOS.a"
          cp -f "$SRC" "$DST"
          ls -la "$DST"
          echo "Verifying architecture:"
          lipo -info "$DST"

      - name: Build unsigned iOS app
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          set -e
          OAL="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/openal-soft"
          LIBS_DIR="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs"
          echo "=== Verify libcocos2d iOS.a exists ==="
          ls -la "$LIBS_DIR/libcocos2d iOS.a"
          echo "=== Building SCMJ ==="
          xcodebuild -project SCMJ.xcodeproj \
            -target SCMJ-mobile \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="\$(inherited) $OAL/include" \
            OTHER_LDFLAGS="\$(inherited) -lwebp -L$OAL/build-ios -lopenal -framework CoreAudio -Wl,-sectcreate,__TEXT,__entitlements,ios/SCMJ-mobile.entitlements" \
            build 2>&1 | tail -30

      - name: Package unsigned IPA
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r SCMJ-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-ios-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/SCMJ-unsigned.ipa

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip server deploy package (排除 node_modules/logs/临时脚本)
        run: |
          cd server
          zip -r ../server_deploy.zip account_server admin game_server hall_server public uploads utils package.json package-lock.json

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: server-deploy
          path: server_deploy.zip
