name: Build Native Packages

on:
  push:
    branches: [main]
    # 只有客户端构建产物/源码变化才打包, 避免改文档或 server 也触发一次完整 APK 构建
    paths:
      - "client/build/**"
      - "client/assets/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  android:
    # ubuntu-latest 已切换到 26.04, 其预装 android-36 资源表损坏导致 AAPT2 链接失败。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK r21e
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;21.4.7075529" "ndk;25.1.8937393" "platforms;android-33" "build-tools;33.0.3"
          echo "NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties

      - name: Rebuild hot update manifest
        # APK 内置清单版本必须 >= 线上热更版本, 否则新装机一启动会被线上旧热更覆盖(手册 4.6 红线)。
        # 新服 47.243.106.169 当前内置版本 1.0.28，必须不低于线上热更版本。
        run: node tools/gen_manifest.js client/build/jsb-default 1.0.28 http://47.243.106.169:9100/hotupdate

      - name: Build unsigned release APK
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :SCMJ:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace

      - name: Sign APK
        run: |
          BT=$ANDROID_HOME/build-tools/33.0.3
          OUT="client/build/jsb-default/frameworks/runtime-src/proj.android-studio/app/build/outputs/apk/release"
          UNSIGNED=$(ls $OUT/*-unsigned.apk | head -1)
          echo "unsigned: $UNSIGNED"
          # 固定签名: 用仓库里固定的keystore, 不再每次随机生成(随机密钥每次都变, 新包无法覆盖安装, 只能卸载重装)
          cp .github/signing/scmj.jks scmj.jks
          $BT/zipalign -f -p 4 "$UNSIGNED" SCMJ-aligned.apk
          $BT/apksigner sign --ks scmj.jks --ks-pass pass:scmj123456 --key-pass pass:scmj123456 \
            --v1-signing-enabled true --v2-signing-enabled true --out SCMJ-signed.apk SCMJ-aligned.apk
          $BT/apksigner verify --print-certs SCMJ-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-android-signed
          path: SCMJ-signed.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-archive libwebp (旧归档成员未 8 字节对齐,新 ld 拒绝)
        run: |
          LIBS="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs"
          lipo "$LIBS/libwebp.a" -thin arm64 -output /tmp/webp_arm64.a || cp "$LIBS/libwebp.a" /tmp/webp_arm64.a
          rm -rf /tmp/wp && mkdir -p /tmp/wp && cd /tmp/wp
          ar x /tmp/webp_arm64.a
          libtool -static -o /tmp/webp_fixed.a *.o
          cp /tmp/webp_fixed.a "$LIBS/libwebp.a"
          lipo -info "$LIBS/libwebp.a"

      - name: Build OpenAL Soft (苹果已从 iOS 移除系统 OpenAL,编译静态库直接打进包)
        run: |
          OAL="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/openal-soft"
          cmake -S "$OAL" -B "$OAL/build-ios" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLIBTYPE=STATIC \
            -DALSOFT_REQUIRE_COREAUDIO=ON \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL=OFF
          cmake --build "$OAL/build-ios" --parallel
          ls -la "$OAL/build-ios/libopenal.a"

      - name: Fetch WechatOpenSDK
        # 16MB 静态库不入库, 构建时从微信官方下载; 头文件和隐私清单随仓库提交。
        run: |
          WX="client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/ios/wechat"
          mkdir -p "$WX"
          curl -fsSL https://dldir1.qq.com/WechatWebDev/opensdk/OpenSDK2.1.0_NoPay.zip -o /tmp/wxsdk.zip
          unzip -o /tmp/wxsdk.zip -d /tmp/wxsdk
          cp /tmp/wxsdk/OpenSDK2.1.0_NoPay/libWeChatSDK.a "$WX/"
          ls -lh "$WX/libWeChatSDK.a"

      - name: Rebuild hot update manifest
        # 手动构建会把 project/version.manifest 改成带哈希的文件名, iOS 打包前必须重新生成固定入口文件。
        run: node tools/gen_manifest.js client/build/jsb-default 1.0.28 http://47.243.106.169:9100/hotupdate

      - name: Build unsigned iOS app
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          OAL="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/openal-soft"
          xcodebuild -project SCMJ.xcodeproj \
            -target SCMJ-mobile \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="\$(inherited) $OAL/include \$(SRCROOT)/ios/wechat" \
            OTHER_LDFLAGS="\$(inherited) -lwebp -L$OAL/build-ios -lopenal -L\$(SRCROOT)/ios/wechat -lWeChatSDK -Objc -framework CoreAudio -framework CoreTelephony -framework SystemConfiguration -framework Security -framework CFNetwork -lz -lsqlite3 -Wl,-sectcreate,__TEXT,__entitlements,ios/SCMJ-mobile.entitlements" \
            build

      - name: Package unsigned IPA
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r SCMJ-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-ios-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/SCMJ-unsigned.ipa
