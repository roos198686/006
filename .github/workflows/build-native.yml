name: Build Native Packages

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK r21e
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;21.4.7075529" "ndk;25.1.8937393" "platforms;android-33" "build-tools;33.0.3"
          echo "NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties

      - name: Build unsigned release APK
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :SCMJ:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace

      - name: Sign APK
        run: |
          BT=$ANDROID_HOME/build-tools/33.0.3
          OUT="client/build/jsb-default/frameworks/runtime-src/proj.android-studio/app/build/outputs/apk/release"
          UNSIGNED=$(ls $OUT/*-unsigned.apk | head -1)
          echo "unsigned: $UNSIGNED"
          keytool -genkeypair -v -keystore scmj.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias scmj -storepass scmj123456 -keypass scmj123456 \
            -dname "CN=SCMJ, OU=Dev, O=SCMJ, L=PZ, ST=SC, C=CN" > /dev/null 2>&1
          $BT/zipalign -f -p 4 "$UNSIGNED" SCMJ-aligned.apk
          $BT/apksigner sign --ks scmj.jks --ks-pass pass:scmj123456 --key-pass pass:scmj123456 \
            --v1-signing-enabled true --v2-signing-enabled true --out SCMJ-signed.apk SCMJ-aligned.apk
          $BT/apksigner verify --print-certs SCMJ-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-android-signed
          path: SCMJ-signed.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-archive libwebp (旧归档成员未 8 字节对齐,新 ld 拒绝)
        run: |
          LIBS="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/ios/libs"
          lipo "$LIBS/libwebp.a" -thin arm64 -output /tmp/webp_arm64.a || cp "$LIBS/libwebp.a" /tmp/webp_arm64.a
          rm -rf /tmp/wp && mkdir -p /tmp/wp && cd /tmp/wp
          ar x /tmp/webp_arm64.a
          libtool -static -o /tmp/webp_fixed.a *.o
          cp /tmp/webp_fixed.a "$LIBS/libwebp.a"
          lipo -info "$LIBS/libwebp.a"

      - name: Build OpenAL Soft (苹果已从 iOS 移除系统 OpenAL,编译静态库直接打进包)
        run: |
          OAL="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/openal-soft"
          cmake -S "$OAL" -B "$OAL/build-ios" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLIBTYPE=STATIC \
            -DALSOFT_REQUIRE_COREAUDIO=ON \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL=OFF
          cmake --build "$OAL/build-ios" --parallel
          ls -la "$OAL/build-ios/libopenal.a"

      - name: Build unsigned iOS app
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          OAL="$GITHUB_WORKSPACE/client/build/jsb-default/frameworks/cocos2d-x/external/openal-soft"
          xcodebuild -project SCMJ.xcodeproj \
            -target SCMJ-mobile \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="\$(inherited) $OAL/include" \
            OTHER_LDFLAGS="\$(inherited) -lwebp -L$OAL/build-ios -lopenal -framework CoreAudio -Wl,-sectcreate,__TEXT,__entitlements,ios/SCMJ-mobile.entitlements" \
            build

      - name: Package unsigned IPA
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r SCMJ-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-ios-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/SCMJ-unsigned.ipa
