  body {

<body>
  <div class="logo"><img src="./app_icon.png" alt="顺宝宝"></div>
  <div class="app-name">顺宝宝</div>
  <div class="app-sub">轻松娱乐 · 随时开局</div>

  <div class="browser-warn" id="browserWarn">
    <b>当前浏览器无法下载安装包</b>
    <div class="steps" id="warnSteps">请复制本页链接，粘贴到手机自带的浏览器（Chrome / Safari / 华为 / 小米 / OPPO / vivo 浏览器）里打开。</div>
    <span class="copy-btn" id="copyBtn">复制本页链接</span>
  </div>

  <div class="card" id="card">
    <div class="loading">正在获取最新版本...</div>
  </div>

  <a id="dlBtn" class="dl-btn disabled" href="javascript:;">暂无安装包</a>

  <div class="tips">
    点击下载后请在浏览器中允许安装<br>
    若提示"未知来源"，请在手机设置中允许安装
  </div>

<script>
// ==== 浏览器识别: 应用内浏览器/第三方浏览器禁止下载, 引导到手机自带浏览器 ====
var ua = navigator.userAgent || '';
var isMobile = /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(ua);
var BLOCK_LIST = [
  [/MicroMessenger/i, '微信'],
  [/QQ\//i, 'QQ'],
  [/Weibo/i, '微博'],
  [/AlipayClient/i, '支付宝'],
  [/aweme|BytedanceWebview/i, '抖音'],
  [/DingTalk/i, '钉钉'],
  [/UCBrowser/i, 'UC浏览器'],
  [/Quark/i, '夸克浏览器'],
  [/MQQBrowser/i, 'QQ浏览器'],
  [/baiduboxapp/i, '百度App'],
  [/SogouMobileBrowser/i, '搜狗浏览器'],
  [/QihooBrowser|360SE/i, '360浏览器'],
  [/LieBaoFast/i, '猎豹浏览器'],
  [/2345Browser/i, '2345浏览器'],
  [/Maxthon/i, '遨游浏览器'],
  [/;\s*wv\)/i, '应用内置浏览器']
];
var blockedName = '';
if(isMobile){
  for(var i = 0; i < BLOCK_LIST.length; ++i){
    if(BLOCK_LIST[i][0].test(ua)){ blockedName = BLOCK_LIST[i][1]; break; }
  }
}
function showBrowserWarn(){
  document.getElementById('browserWarn').classList.add('show');
  var tip = blockedName === '微信'
    ? '当前是微信内置浏览器，无法下载 APK。请点击右上角 ··· ，选择“在浏览器打开”，再重新下载。'
    : '当前是' + blockedName + '，可能拦截安装包下载。请复制本页链接，粘贴到手机自带浏览器（Chrome / Safari / 华为 / 小米 / OPPO / vivo 浏览器）后打开下载。';
  document.getElementById('warnSteps').innerHTML = tip;
}
function copyPageLink(){
  var url = location.href.split('#')[0];
  var done = function(){ document.getElementById('copyBtn').textContent = '已复制，去浏览器粘贴打开'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, function(){ fallbackCopy(url, done); });
  } else {
    fallbackCopy(url, done);
  }
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ prompt('请长按复制本页链接', text); }
  document.body.removeChild(ta);
}
document.getElementById('copyBtn').addEventListener('click', copyPageLink);
if(blockedName){ showBrowserWarn(); }

function fmtSize(n){
  if(!n) return '0 B';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(2) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}
fetch('./app/info').then(function(r){ return r.json(); }).then(function(ret){
  var card = document.getElementById('card');
  var btn = document.getElementById('dlBtn');
  if(!ret || ret.code !== 0 || !ret.data){
    card.innerHTML = '<div class="loading" style="color:#e74c3c">获取版本信息失败</div>';
    btn.textContent = '下载失败';
    return;
  }
  var d = ret.data;
  var t = d.update_time ? new Date(d.update_time*1000).toLocaleString() : '—';
  if(!d.has_file){
    card.innerHTML =
      '<div class="row"><span class="k">版本号</span><span class="v">—</span></div>' +
      '<div class="row"><span class="k">大小</span><span class="v">—</span></div>' +
      '<div class="row"><span class="k">更新时间</span><span class="v">—</span></div>' +
      '<div class="row"><span class="k">状态</span><span class="v status-warn">暂无安装包</span></div>';
    btn.textContent = '暂无安装包';
    btn.className = 'dl-btn disabled';
    btn.href = 'javascript:;';
  } else {
    card.innerHTML =
      '<div class="row"><span class="k">版本号</span><span class="v">' + d.version + '</span></div>' +
      '<div class="row"><span class="k">安装包大小</span><span class="v">' + fmtSize(d.size) + '</span></div>' +
      '<div class="row"><span class="k">更新时间</span><span class="v">' + t + '</span></div>' +
      '<div class="row"><span class="k">状态</span><span class="v status-ok">可下载</span></div>';
    if(blockedName){
      btn.textContent = '请在手机自带浏览器中下载';
      btn.className = 'dl-btn disabled';
      btn.href = 'javascript:;';
    } else {
      btn.textContent = '立即下载顺宝宝';
      btn.className = 'dl-btn';
      btn.href = d.url;
    }
  }
}).catch(function(){
  document.getElementById('card').innerHTML = '<div class="loading" style="color:#e74c3c">网络错误，请稍后重试</div>';
});
</script>
</body>
</html>
