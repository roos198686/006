<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>顺宝宝 - 下载安装</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #6a11cb 0%, #2575fc 100%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    color:#fff; padding: 40px 24px 32px;
  }
  .logo {
    width: 120px; height:120px; border-radius: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    margin-bottom: 20px;
    background:#fff;
    overflow:hidden;
  }
  .logo img { width:100%; height:100%; display:block; object-fit:contain; }
  .app-name { font-size: 26px; font-weight:700; letter-spacing:2px; }
  .app-sub { font-size: 14px; opacity:.8; margin-top:6px; }
  .card {
    margin-top: 36px; width:100%; max-width: 420px;
    background: rgba(255,255,255,.95); color:#222;
    border-radius: 18px; padding: 24px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:15px; border-bottom:1px solid #eee; }
  .row:last-child { border-bottom:none; }
  .row .k { color:#888; }
  .row .v { font-weight:600; color:#2575fc; }
  .status-ok { color:#27ae60 !important; }
  .status-warn { color:#e67e22 !important; }
  .dl-btn {
    margin-top: 28px; width:100%; max-width:420px;
    display:block; text-align:center;
    background:#fff; color:#2575fc; font-weight:700; font-size:18px;
    padding: 16px 0; border-radius: 30px; text-decoration:none;
    box-shadow: 0 6px 18px rgba(0,0,0,.2);
    transition: transform .15s;
  }
  .dl-btn:active { transform: scale(.97); }
  .dl-btn.disabled { background:rgba(255,255,255,.5); color:#999; pointer-events:none; }
  .tips { margin-top: 22px; font-size:12px; opacity:.8; line-height:1.8; max-width:420px; text-align:center; }
  .loading { text-align:center; padding: 20px 0; color:#888; }
</style>
</head>
<body>
  <div class="logo"><img src="./app_icon.png" alt="顺宝宝"></div>
  <div class="app-name">顺宝宝</div>
  <div class="app-sub">轻松娱乐 · 随时开局</div>

  <div class="card" id="card">
    <div class="loading">正在获取最新版本...</div>
  </div>

  <a id="dlBtn" class="dl-btn disabled" href="javascript:;">暂无安装包</a>

  <div class="tips">
    点击下载后请在浏览器中允许安装<br>
    若提示"未知来源"，请在手机设置中允许安装
  </div>

<script>
function fmtSize(n){
  if(!n) return '0 B';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(2) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}
fetch('./app/info').then(function(r){ return r.json(); }).then(function(ret){
  var card = document.getElementById('card');
  var btn = document.getElementById('dlBtn');
  if(!ret || ret.code !== 0 || !ret.data){
    card.innerHTML = '<div class="loading" style="color:#e74c3c">获取版本信息失败</div>';
    btn.textContent = '下载失败';
    return;
  }
  var d = ret.data;
  var t = d.update_time ? new Date(d.update_time*1000).toLocaleString() : '—';
  if(!d.has_file){
    card.innerHTML =
      '<div class="row"><span class="k">版本号</span><span class="v">—</span></div>' +
      '<div class="row"><span class="k">大小</span><span class="v">—</span></div>' +
      '<div class="row"><span class="k">更新时间</span><span class="v">—</span></div>' +
      '<div class="row"><span class="k">状态</span><span class="v status-warn">暂无安装包</span></div>';
    btn.textContent = '暂无安装包';
    btn.className = 'dl-btn disabled';
    btn.href = 'javascript:;';
  } else {
    card.innerHTML =
      '<div class="row"><span class="k">版本号</span><span class="v">' + d.version + '</span></div>' +
      '<div class="row"><span class="k">安装包大小</span><span class="v">' + fmtSize(d.size) + '</span></div>' +
      '<div class="row"><span class="k">更新时间</span><span class="v">' + t + '</span></div>' +
      '<div class="row"><span class="k">状态</span><span class="v status-ok">可下载</span></div>';
    btn.textContent = '立即下载顺宝宝';
    btn.className = 'dl-btn';
    btn.href = d.url;
  }
}).catch(function(){
  document.getElementById('card').innerHTML = '<div class="loading" style="color:#e74c3c">网络错误，请稍后重试</div>';
});
</script>
</body>
</html>
